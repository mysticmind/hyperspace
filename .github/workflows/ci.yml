name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The security properties and the linters. Runs on Linux because none of it
  # needs macOS, which keeps the check that matters most also the fastest.
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security properties
        run: ./tests/properties.sh

      # shellcheck is preinstalled on the ubuntu runner. Installing it would
      # mean apt-get, which means sudo, which tests/properties.sh bans across
      # the whole repo. Keeping the ban carve-out-free is worth more than the
      # convenience.
      - name: shellcheck
        run: |
          # SC1090/SC1091: sourced paths resolved at runtime.
          # SC2086: intentional word splitting in the `defaults read $pair` calls.
          #
          # A while-read loop, not `xargs sh -c`: that returns non-zero for
          # every file that is NOT bash, so the step failed with nothing wrong.
          files=""
          while IFS= read -r f; do
            head -1 "$f" | grep -q bash && files="$files $f"
          done < <(find . -path ./.git -prune -o -type f -print)
          echo "checking:$files"
          # shellcheck disable=SC2086
          shellcheck -e SC1090,SC1091,SC2086 --severity=warning $files

      - name: python syntax
        run: |
          for f in bin/cheatsheet bin/plugin bin/plugin-dialog bin/build-config bin/karabiner-rule; do
            python3 -m py_compile "$f"
          done

  # macOS-only checks: the Swift panels have to compile, and the dry run has to
  # be inert on a real machine with real `defaults`.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: |
          # See the shellcheck step: `xargs sh -c` fails on every non-bash file.
          rc=0
          while IFS= read -r f; do
            head -1 "$f" | grep -q bash || continue
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; rc=1; fi
          done < <(find . -path ./.git -prune -o -type f -print)
          exit $rc

      - name: swift compiles
        run: |
          for f in bin/*.swift; do
            swiftc -O -parse-as-library "$f" -o "$RUNNER_TEMP/$(basename "$f" .swift)"
            echo "ok $f"
          done

      - name: cheatsheet parses a config
        env:
          HYPERSPACE_AEROSPACE_CONFIG: config/aerospace/aerospace.base.toml
        run: |
          ./bin/cheatsheet --json > /tmp/sheet.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/sheet.json"))
          assert d, "cheatsheet produced no sections"
          n = sum(len(s["rows"]) for s in d)
          assert n > 10, f"suspiciously few bindings: {n}"
          print(f"{len(d)} sections, {n} bindings")
          PY

      - name: --dry-run is inert
        run: ./tests/dryrun.sh

  # The reversibility contract: install, uninstall, assert the machine is
  # unchanged. This is the repo's central promise and nothing else tests it, so
  # it runs for real and is allowed to fail the build.
  #
  # It was gated to workflow_dispatch on the grounds that Karabiner needs a
  # system extension a runner cannot approve. That was wrong. The actual
  # blocker was narrower: a machine that has never launched Karabiner-Elements
  # has no karabiner.json, karabiner-rule refuses to invent one, and install.sh
  # runs set -e. tests/reversible.sh now seeds a minimal config first, which
  # both unblocks this and makes the merge-and-restore path testable.
  #
  # A real install on a throwaway runner: it takes the casks and several
  # minutes, which is why it does not gate the fast checks above.
  reversible:
    runs-on: macos-latest
    needs: [properties]
    steps:
      - uses: actions/checkout@v4

      # Homebrew 6 will not load a cask from a non-official tap until it is
      # trusted, and a fresh runner trusts nothing. install.sh deliberately
      # refuses to do this for you, so CI does it here where it is visible in
      # the log rather than hidden inside the installer.
      - name: trust the taps this repo needs
        run: |
          taps=$(grep -oE '^tap "[^"]+"' Brewfile | sed 's/^tap "//;s/"$//')
          echo "trusting:" $taps
          # shellcheck disable=SC2086
          brew trust $taps

      - name: install then uninstall, and diff the machine
        env:
          HYPERSPACE_TEST_I_MEAN_IT: "1"
        run: ./tests/reversible.sh
